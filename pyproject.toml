[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approxguard"
version = "0.1.0"
description = "ApproxGuard: Aging-Aware Layerwise Mapping of Approximate Multipliers for Reliable TinyML VLSI Accelerators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
approxguard = "approxguard.cli:main"

[tool.setuptools.packages.find]
include = ["approxguard*"]
